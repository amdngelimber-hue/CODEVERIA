<script>
const KEY="kelas_ifc_data_v3", SK="kelas_ifc_admin", USER="admin", PASS="kelastic";
const HARI=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const SEC={
 mhs:{t:"Data Mahasiswa",f:[["nim","NIM"],["nama","Nama"]]},
 mk:{t:"Mata Kuliah, Dosen & Jadwal",f:[["nama","Nama Mata Kuliah"],["dosen","Dosen"],["hari","Hari",HARI],["mulai","Jam Mulai","time"],["selesai","Jam Selesai","time"],["ruang","Ruang"]]}
};
const SEED={
 mhs:[{nim:"2401001",nama:"Contoh Mahasiswa 1",email:"mhs1@kampus.ac.id"},{nim:"2401002",nama:"Contoh Mahasiswa 2",email:"mhs2@kampus.ac.id"}],
 mk:[
  {nama:"Algoritma dan Pemrograman",dosen:"Dosen Pengampu 1",hari:"Senin",mulai:"08:00",selesai:"10:30",ruang:"Lab 1"},
  {nama:"Struktur Data",dosen:"Dosen Pengampu 2",hari:"Senin",mulai:"13:00",selesai:"15:30",ruang:"Lab 2"},
  {nama:"Basis Data",dosen:"Dosen Pengampu 3",hari:"Selasa",mulai:"08:00",selesai:"10:30",ruang:"Ruang 201"},
  {nama:"Jaringan Komputer",dosen:"Dosen Pengampu 4",hari:"Rabu",mulai:"10:00",selesai:"12:30",ruang:"Lab Jaringan"},
  {nama:"Pemrograman Web",dosen:"Dosen Pengampu 5",hari:"Kamis",mulai:"08:00",selesai:"10:30",ruang:"Lab 1"},
  {nama:"Sistem Operasi",dosen:"Dosen Pengampu 6",hari:"Jumat",mulai:"09:00",selesai:"11:30",ruang:"Ruang 202"}
 ]
};
const IC={pendaftar:"📝",home:"🏠",mhs:"👩‍🎓",mk:"📚",jadwal:"🗓️"};
let DB, admin=false, tab="home", flash="";
try{admin=sessionStorage.getItem(SK)==="1"}catch(e){}
const hr=x=>{const i=HARI.indexOf(x);return i<0?9:i};
function load(){
 try{const r=localStorage.getItem(KEY); if(r){DB=JSON.parse(r);return}}catch(e){}
 try{const o=JSON.parse(localStorage.getItem("kelas_ifc_data_v2")||"null");
  if(o){const mk=(o.mk||[]).map(x=>({...x})),used=new Set();
   (o.jadwal||[]).forEach(j=>{const m=mk.find(x=>x.nama===j.mk&&!used.has(x));
    if(m){used.add(m);Object.assign(m,{dosen:j.dosen,hari:j.hari,mulai:j.mulai,selesai:j.selesai,ruang:j.ruang})}
    else mk.push({nama:j.mk,dosen:j.dosen,hari:j.hari,mulai:j.mulai,selesai:j.selesai,ruang:j.ruang})});
   DB={mhs:o.mhs||[],mk};save();return}}catch(e){}
 DB=JSON.parse(JSON.stringify(SEED)); save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return true}catch(e){return false}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

const av=(r,c="")=>r.foto?`<img class="av ${c}" src="${r.foto}" alt="${esc(r.nama||"")}">`:`<span class="av ${c}">${esc((r.nama||"?").trim().charAt(0).toUpperCase())}</span>`;
function resize(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const n=240,c=document.createElement("canvas");c.width=c.height=n;const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;c.getContext("2d").drawImage(im,sx,sy,m,m,0,0,n,n);ok(c.toDataURL("image/jpeg",.8))};im.src=fr.result};fr.readAsDataURL(file)})}
function shrink(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.78))};im.src=fr.result};fr.readAsDataURL(file)})}
const IGURL="https://www.instagram.com/codeveria?mdxt=NTc3ZGJzbDR6dTV5";
const ig=()=>`<a class="card nt igc" href="${IGURL}" target="_blank" rel="noopener noreferrer"><span class="igi"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></span><span class="igt"><b>Ikuti kami di Instagram</b><small>@codeveria · tekan untuk membuka Instagram</small></span><span class="iga">↗</span></a>`;
const gal=()=>{const F=DB.foto||[];return `<div class="card nt gal"><h2>📸 Galeri Kelas</h2>`+(admin?`<div class="gadd"><input id="gcap" placeholder="Keterangan foto (opsional)"><label class="btn gbtn">+ Tambah Foto<input id="gf" type="file" accept="image/*" multiple hidden></label></div><div id="gmsg" class="fmmsg"></div>`:`<p class="mu">Kumpulan momen kebersamaan Kelas Informatika C.</p>`)+(F.length?`<div class="gg">${F.map((p,i)=>`<figure class="pic rv ${i%2?"r":"l"}" style="--tilt:${[-2.2,1.6,-1.2,2][i%4]}deg" data-i="${i}"><span class="no">✦ ${i+1} / ${F.length}</span><div class="pimg"><img src="${p.src}" alt="${esc(p.cap||"Foto galeri kelas")}" loading="lazy"></div>${p.cap?`<figcaption>${esc(p.cap)}</figcaption>`:""}${admin?`<button class="pdel" data-d="${i}" title="Hapus foto">✕</button>`:""}</figure>`).join("")}</div>`:`<p class="mu">Belum ada foto di galeri kelas.</p>`)+`</div>`};
function openLb(x){$("lbi").src=x.src;$("lbc").textContent=x.cap||"";$("lb").classList.add("on")}
$("lb").onclick=()=>$("lb").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("on")});
function wireHome(){
 const f=$("gf");
 if(f)f.onchange=async()=>{const fs=[...f.files];if(!fs.length)return;const cap=$("gcap").value.trim(),m=$("gmsg");m.className="fmmsg";m.textContent="⏳ Memproses foto...";let n=0;
  const nw=[];for(const x of fs){try{nw.push({src:await shrink(x,900),cap});n++}catch(e){}}DB.foto.unshift(...nw);
  const ok=save();render();const g=$("gmsg");if(n){const fp=document.querySelector(".pic");if(fp)fp.scrollIntoView({behavior:"smooth",block:"center"})}
  if(g){g.textContent=n?(ok?`✅ ${n} foto ditambahkan`:"⚠️ Foto tampil, tapi penyimpanan browser penuh sehingga mungkin tidak tersimpan permanen. Hapus foto lama atau pilih lebih sedikit."):"⚠️ Foto tidak bisa dibaca";if(!ok||!n)g.className="fmmsg bad"}};
 document.querySelectorAll(".pdel").forEach(b=>b.onclick=e=>{e.stopPropagation();DB.foto.splice(+b.dataset.d,1);save();render()});
 document.querySelectorAll(".pic").forEach(p=>p.onclick=()=>{const x=DB.foto[+p.dataset.i];if(x)openLb(x)});
 const els=document.querySelectorAll(".rv");
 if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}}),{threshold:.12,rootMargin:"0px 0px -40px 0px"});
 els.forEach(e=>io.observe(e));
}
const sg=rows=>rows.length?`<div class="sg">${rows.map((r,k)=>{const c=!!r._c,i=c?-1:DB.mhs.indexOf(r),mine=c?r._u===REG.uid:(!!r.owner&&r.owner===REG.uid);return `<div class="sc" style="animation-delay:${Math.min(k,12)*70}ms">${mine?`<span class="mine">Data saya</span>`:""}${admin&&!c?`<button class="avb ring" data-p="${i}" title="Klik untuk ganti foto">${av(r,"xl")}</button>`:`<div class="ring">${av(r,"xl")}</div>`}<b>${esc(r.nama||"-")}</b><span class="nim">${canNim()?"NIM "+esc(r.nim||"-"):"🔒 NIM tersembunyi"}</span>${admin?`<div><button class="del" ${c?`data-cu="${esc(r._u)}"`:`data-i="${i}"`}>Hapus</button></div>`:""}</div>`}).join("")}</div>`:`<p class="mu">Belum ada data.</p>`;
const MH={cloud:{},nim:{}};let lastSig="";
const REG={mode:"local",ready:false,uid:null,regs:{},dec:{},canWrite:true,owner:false,db:null};
const rk="kelas_ifc_reg_v1";
const lread=()=>{try{return JSON.parse(localStorage.getItem(rk)||"{}")}catch(e){return{}}};
const persist=()=>{if(REG.mode==="local"){try{localStorage.setItem(rk,JSON.stringify({regs:REG.regs,dec:REG.dec}))}catch(e){}}};
const stOf=id=>{const r=REG.regs[id];if(!r)return null;const d=REG.dec[id];return d&&d.rt===r.t?d.status:"menunggu"};
const regList=()=>Object.keys(REG.regs).map(id=>({id,...REG.regs[id],st:stOf(id)})).sort((a,b)=>b.t-a.t);
const pending=()=>regList().filter(x=>x.st==="menunggu").length;
async function regInit(){
 let db=null,user=null,id=null;
 try{if(window.claude&&window.claude.use){db=await claude.use("db");user=await claude.use("user")}}catch(e){}
 if(db&&user){try{id=await user.id()}catch(e){}}
 if(db&&user&&id){
  REG.mode="cloud";REG.db=db;REG.uid=id;
  try{REG.canWrite=(await user.can("data.write"))!==false}catch(e){}
  try{REG.owner=!!(await user.isOwner())||!!(await user.canEdit())}catch(e){}
  const mine=(path,key)=>db.doc(path+"/"+id).onSnapshot(sn=>{if(sn.exists)REG[key][id]=sn.data();else delete REG[key][id];refreshUI()},()=>{});
  mine("reg","regs");mine("ok","dec");
  db.collection("mhs").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());MH.cloud=m;refreshUI()},()=>{});
  db.collection("mhsn").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=(d.data()||{}).nim);MH.nim=m;refreshUI()},()=>{});
  if(REG.owner){
   db.collection("reg").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());REG.regs=m;refreshUI()},()=>{});
   db.collection("ok").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());REG.dec=m;refreshUI()},()=>{});
  }
 }else{
  REG.mode="local";
  try{id=localStorage.getItem("kelas_ifc_dev");if(!id){id="d"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("kelas_ifc_dev",id)}}catch(e){}
  REG.uid=id||"d"+Math.random().toString(36).slice(2);
  const o=lread();REG.regs=o.regs||{};REG.dec=o.dec||{};
  addEventListener("storage",e=>{if(e.key===rk){const o=lread();REG.regs=o.regs||{};REG.dec=o.dec||{};refreshUI()}});
 }
}
async function regSubmit(nama,nim){
 const o={nama,nim,t:Date.now()};
 if(REG.mode==="cloud")await REG.db.doc("reg/"+REG.uid).set(o);
 REG.regs[REG.uid]=o;persist();
}
async function regDecide(id,status){
 const r=REG.regs[id];if(!r)return;const d={status,t:Date.now(),rt:r.t};
 if(REG.mode==="cloud")await REG.db.doc("ok/"+id).set(d);
 REG.dec[id]=d;persist();
}
async function regRemove(id){
 if(REG.mode==="cloud"){await REG.db.doc("reg/"+id).delete();await REG.db.doc("ok/"+id).delete()}
 delete REG.regs[id];delete REG.dec[id];persist();
}
const canNim=()=>admin||(REG.ready&&stOf(REG.uid)==="disetujui");
const myNim=()=>{const m=myMh();return m?(REG.mode==="cloud"?(MH.nim[REG.uid]||""):(m.nim||"")):""};
const cloudRows=()=>Object.keys(MH.cloud).map(u=>({...MH.cloud[u],nim:MH.nim[u],_c:1,_u:u})).sort((a,b)=>(b.t||0)-(a.t||0));
const myMh=()=>REG.mode==="cloud"?(MH.cloud[REG.uid]||null):(DB.mhs.find(x=>x.owner===REG.uid)||null);
const canSelf=()=>!admin&&REG.ready&&REG.canWrite&&stOf(REG.uid)==="disetujui";
const selfCard=()=>{const m=myMh(),rg=REG.regs[REG.uid]||{};return `<div class="card"><h2>🙋 Data Saya</h2><p class="mu">${m?"Data Anda sudah ada. Anda bisa mengubah foto dan datanya, atau menghapusnya lalu menambahkannya lagi.":"Sebagai mahasiswa terdaftar, Anda bisa menambahkan satu data diri (foto, NIM, nama). Jika nanti dihapus, Anda bisa menambahkannya lagi."}</p><form id="sf"><div style="grid-column:1/-1;display:flex;align-items:center;gap:14px"><label class="ph${m&&m.foto?" has":""}" id="sph" ${m&&m.foto?`style="background-image:url(${m.foto})"`:""}><b>📷</b><span>Foto</span><input type="file" accept="image/*" hidden></label><span class="mu">Klik bulatan untuk memilih foto</span></div><div><label>NIM</label><input name="nim" value="${esc(m?myNim():(rg.nim||""))}" autocomplete="off"></div><div><label>Nama</label><input name="nama" value="${esc(m?m.nama:(rg.nama||""))}" autocomplete="off"></div><button class="btn">${m?"Simpan Perubahan":"+ Tambah Data Saya"}</button>${m?`<button type="button" class="del" id="sdel">Hapus Data Saya</button>`:""}</form><div id="smsg" class="fmmsg"></div></div>`};
function wireSelf(){
 let file=null;const sf=$("sf"),fi=sf.querySelector("input[type=file]"),say=(t,bad)=>{const m=$("smsg");if(m){m.className="fmmsg"+(bad?" bad":"");m.textContent=t}};
 fi.onchange=async()=>{if(!fi.files[0])return;file=fi.files[0];try{const u=await resize(file),ph=$("sph");ph.style.backgroundImage=`url(${u})`;ph.classList.add("has")}catch(x){alert("Foto tidak bisa dibaca.");file=null}};
 sf.onsubmit=async e=>{e.preventDefault();const nim=sf.nim.value.trim(),nama=sf.nama.value.trim();
  if(!nim||!nama){say("⚠️ Mohon isi NIM dan nama",1);return}
  const m=myMh();let foto=m&&m.foto;
  if(file){try{foto=await resize(file)}catch(x){alert("Foto tidak bisa dibaca.");return}}
  const o={nama,t:(m&&m.t)||Date.now(),u:Date.now(),owner:REG.uid};if(foto)o.foto=foto;
  try{
   if(REG.mode==="cloud"){await REG.db.doc("mhs/"+REG.uid).set(o);await REG.db.doc("mhsn/"+REG.uid).set({nim});MH.cloud[REG.uid]=o;MH.nim[REG.uid]=nim}
   else{o.nim=nim;const i=DB.mhs.findIndex(x=>x.owner===REG.uid);if(i>=0)DB.mhs[i]=o;else DB.mhs.push(o);save()}
   render();say(m?"✅ Perubahan disimpan":"✅ Data Anda berhasil ditambahkan");
  }catch(x){say("⚠️ Gagal menyimpan. Akun ini mungkin belum diizinkan menulis data. Hubungi admin.",1)}};
 const d=$("sdel");
 if(d)d.onclick=async()=>{if(!confirm("Hapus data Anda? Anda bisa menambahkannya lagi nanti."))return;
  try{
   if(REG.mode==="cloud"){await REG.db.doc("mhs/"+REG.uid).delete();await REG.db.doc("mhsn/"+REG.uid).delete();delete MH.cloud[REG.uid];delete MH.nim[REG.uid]}
   else{const i=DB.mhs.findIndex(x=>x.owner===REG.uid);if(i>=0)DB.mhs.splice(i,1);save()}
   render();say("✅ Data Anda dihapus. Anda bisa menambahkannya lagi.");
  }catch(x){say("⚠️ Gagal menghapus data.",1)}};
}
const NT=new Set();let ntT;
function ntf(msg,label,fn){const el=$("nt");$("ntx").textContent=msg;const b=$("ntb");b.textContent=label;b.onclick=()=>{el.classList.remove("on");fn()};$("ntc").onclick=()=>el.classList.remove("on");el.classList.add("on");clearTimeout(ntT);ntT=setTimeout(()=>el.classList.remove("on"),20000)}
function notifyNew(){
 if(!REG.ready||!(admin||REG.owner))return;
 const pend=regList().filter(x=>x.st==="menunggu"),fresh=pend.filter(x=>!NT.has(x.id+":"+x.t));
 pend.forEach(x=>NT.add(x.id+":"+x.t));
 if(!fresh.length||(admin&&tab==="pendaftar"))return;
 const msg=fresh.length===1?`🔔 ${fresh[0].nama} mendaftar dan menunggu persetujuan`:`🔔 ${fresh.length} pendaftar baru menunggu persetujuan`;
 if(admin)ntf(msg,"Lihat",()=>{tab="pendaftar";render()});else ntf(msg,"Login Admin",()=>$("auth").click());
}
function refreshUI(){applyGate();nav();
 const sig=JSON.stringify([Object.keys(MH.cloud).map(u=>u+":"+(MH.cloud[u].u||MH.cloud[u].t||0)),Object.keys(MH.nim).map(u=>u+MH.nim[u]),stOf(REG.uid),admin]),ch=sig!==lastSig;lastSig=sig;
 if(admin&&tab==="pendaftar")renderReg();else if(ch&&tab==="mhs")render()}
let gk="",gateOpen=false;
function applyGate(){
 if(admin)gateOpen=false;
 const g=$("gate");g.style.display=gateOpen?"flex":"none";
 if(gateOpen)drawGate();
 const b=$("rbtn"),st=REG.ready?stOf(REG.uid):null;
 b.style.display=admin?"none":"";
 b.textContent=st==="menunggu"?"⏳ Menunggu":st==="disetujui"?"✅ Terdaftar":st==="ditolak"?"📝 Daftar ulang":"📝 Daftar";
 notifyNew();
}
function drawGate(){
 const st=REG.ready?(stOf(REG.uid)||"none"):"load",r=REG.regs[REG.uid];
 const key=st+"|"+(r?r.t:0)+"|"+REG.mode+REG.canWrite;
 if(key===gk)return;gk=key;
 const form=REG.canWrite?`<h2>Daftar Mahasiswa</h2><p class="mu" style="margin-bottom:14px">Isi nama dan NIM Anda. Setelah admin menyetujui, status Anda berubah menjadi Terdaftar. Web tetap bisa dilihat siapa saja.</p><label>Nama lengkap</label><input id="gn" autocomplete="name"><label>NIM</label><input id="gi" inputmode="numeric" autocomplete="off"><div id="gm" class="fmmsg"></div><button class="btn" id="gb">Daftar</button>`:`<h2>Belum bisa mendaftar</h2><p class="mu">Akun ini belum diizinkan mendaftar. Hubungi admin kelas untuk diberi akses.</p>`;
 let body;
 if(st==="load")body=`<p class="mu">Memeriksa akses...</p>`;
 else if(st==="menunggu")body=`<div class="gst">⏳</div><h2>Menunggu persetujuan</h2><p class="mu" style="margin-bottom:14px">Halo <b>${esc(r.nama)}</b> (NIM ${esc(r.nim)}). Pendaftaran Anda sudah terkirim. Status Anda akan berubah menjadi Terdaftar setelah admin menyetujui.</p><p class="fmmsg" style="text-align:center;margin:0 0 14px;color:#8ee6c0">🤲 sabar broo, sesungguhnya orang yang sabar di sayang tuhan</p><button class="btn" id="gchk">Cek status</button>`;
 else if(st==="disetujui")body=`<div class="gst">✅</div><h2>Anda sudah terdaftar</h2><p class="mu">Selamat, <b>${esc(r.nama)}</b> (NIM ${esc(r.nim)}). Pendaftaran Anda sudah disetujui admin.</p>`;
 else body=(st==="ditolak"?`<div class="fmmsg bad" style="margin-bottom:12px">⚠️ Pendaftaran Anda ditolak admin. Periksa data lalu daftar ulang, atau hubungi admin.</div>`:"")+form;
 const note=REG.mode==="local"?`<p class="mu" style="margin-top:14px;font-size:.78rem">Mode lokal: pendaftaran tersimpan di browser ini.</p>`:"";
 $("gate").innerHTML=`<div class="card gc"><div class="brand" style="justify-content:center;margin-bottom:16px"><div class="logo">🎓</div><div><h1>Kelas Informatika C</h1><small>Portal informasi CODEVERIA</small></div></div>${body}${note}<p style="margin-top:16px"><button class="del" id="gx" style="color:var(--mu);border-color:var(--bd)">Tutup</button></p></div>`;
 $("gx").onclick=()=>{gateOpen=false;applyGate()};
 const chk=$("gchk");if(chk)chk.onclick=()=>{if(REG.mode==="local"){const o=lread();REG.regs=o.regs||{};REG.dec=o.dec||{}}refreshUI()};
 const gb=$("gb");
 if(gb)gb.onclick=async()=>{const n=$("gn").value.trim(),i=$("gi").value.trim(),m=$("gm");
  if(!n||!i){m.className="fmmsg bad";m.textContent="⚠️ Mohon isi nama dan NIM";return}
  gb.disabled=true;
  try{await regSubmit(n,i);gk="";refreshUI()}catch(e){m.className="fmmsg bad";m.textContent="⚠️ Pendaftaran gagal terkirim. Akun ini mungkin belum diizinkan menulis data. Hubungi admin.";gb.disabled=false}};
}
let rf="semua";
function renderReg(){
 const L=regList(),c=x=>L.filter(y=>y.st===x).length,F=rf==="semua"?L:L.filter(x=>x.st===rf);
 const fmt=t=>new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
 const info=REG.mode==="cloud"?(REG.owner?"☁️ Mode online: pendaftar dari semua perangkat masuk ke sini.":"☁️ Mode online, tetapi hanya pemilik web yang bisa melihat dan menyetujui pendaftar."):"⚠️ Mode lokal: hanya pendaftaran dari browser ini yang tampil di sini. Pendaftar dari perangkat lain baru masuk ke daftar ini kalau web dibuka lewat akun claude.ai dan pendaftar juga login dengan akses Contributor.";
 let h=`<div class="card"><h2>📝 Pendaftar</h2><p class="mu">${info} Yang terbaru ada di paling atas.</p><div class="fl">${[["semua","Semua",L.length],["menunggu","Menunggu",c("menunggu")],["disetujui","Disetujui",c("disetujui")],["ditolak","Ditolak",c("ditolak")]].map(([k,t,n])=>`<button class="${rf===k?"on":""}" data-f="${k}">${t} (${n})</button>`).join("")}</div>`;
 h+=F.length?`<div class="rgs">${F.map((x,k)=>`<div class="rg" style="animation-delay:${Math.min(k,10)*50}ms"><span class="av">${esc((x.nama||"?").trim().charAt(0).toUpperCase())}</span><div class="inf"><b>${esc(x.nama)} ${x.st==="menunggu"?`<span class="newb">BARU</span>`:""}</b><small>NIM ${esc(x.nim)} · ${fmt(x.t)}</small></div><span class="stb st-${x.st}">${x.st}</span><div class="act2">${x.st!=="disetujui"?`<button class="rok" data-a="disetujui" data-id="${esc(x.id)}">✔ Setujui</button>`:""}${x.st!=="ditolak"?`<button class="rno" data-a="ditolak" data-id="${esc(x.id)}">✖ Tolak</button>`:""}<button class="del" data-a="hapus" data-id="${esc(x.id)}">Hapus</button></div></div>`).join("")}</div>`:`<p class="mu" style="margin-top:14px">Belum ada pendaftar.</p>`;
 $("main").innerHTML=h+`</div>`;
 document.querySelectorAll(".fl button").forEach(b=>b.onclick=()=>{rf=b.dataset.f;renderReg()});
 document.querySelectorAll(".rg [data-a]").forEach(b=>b.onclick=async()=>{const id=b.dataset.id,a=b.dataset.a;
  try{if(a==="hapus")await regRemove(id);else await regDecide(id,a)}catch(e){alert("Gagal: hanya pemilik web (admin) yang boleh menyetujui, menolak, atau menghapus pendaftar.")}
  refreshUI()});
}
function nav(){
 const pc=(admin||REG.owner)?pending():0,items=[["home","Home"],...Object.keys(SEC).map(k=>[k,SEC[k].t]),...(admin?[["pendaftar","Pendaftar"+(pc?` <span class="nb">${pc}</span>`:"")]]:[])];
 document.title=(pc?"("+pc+") ":"")+"Kelas Informatika C";
 $("nav").innerHTML=items.map(([k,t])=>`<button class="${k===tab?"on":""}" data-k="${k}">${IC[k]} ${t}</button>`).join("");
 $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});
 $("auth").innerHTML=admin?"Logout":"Login Admin"+(pc?` <span class="nb">${pc}</span>`:"");
 $("who").textContent=admin?"👤 Admin":"";
}
function render(){
 applyGate();if(tab==="pendaftar"&&!admin)tab="home";
 nav();
 if(tab==="pendaftar"){renderReg();return}
 if(tab==="home"){
  $("main").innerHTML=`<div class="card hero"><div class="code" aria-hidden="true"><i style="right:4%;top:6%;font-size:5.5rem;--r:-8deg">&lt;/&gt;</i><i style="right:34%;bottom:-6%;font-size:3.2rem;--r:10deg">&lt;/&gt;</i><i style="right:18%;bottom:8%;font-size:1.6rem;--r:-4deg">&lt;/&gt;</i><i style="left:44%;top:4%;font-size:1.4rem;--r:6deg">&lt;/&gt;</i><i style="right:2%;bottom:2%;font-size:2.4rem;--r:-12deg">&lt;/&gt;</i></div><span class="chip">✨ Semester ini</span><h2>Selamat datang di Kelas Informatika C</h2>
  <p>Temukan data mahasiswa, mata kuliah, serta jadwal lengkap dengan dosen dan jamnya di satu tempat.</p></div>
  <div class="grid">${Object.keys(SEC).map(k=>`<div class="card stat"><i>${IC[k]}</i><b>${DB[k].length+(k==="mhs"?Object.keys(MH.cloud).length:0)}</b><span class="mu">${SEC[k].t}</span></div>`).join("")}</div>${ig()}${gal()}`;
  wireHome();return;
 }
 const s=SEC[tab], rows=tab==="mhs"?[...DB.mhs,...cloudRows()]:[...DB[tab]];
 if(tab==="mk") rows.sort((a,b)=>hr(a.hari)-hr(b.hari)||(a.mulai||"").localeCompare(b.mulai||""));
 const pre=(tab==="mhs"&&canSelf())?selfCard():"";
 let h=pre+`<div class="card"><h2>${s.t}</h2>`;
 if(admin){
  h+=`<form id="fm">`+(tab==="mhs"?`<div style="grid-column:1/-1;display:flex;align-items:center;gap:14px"><label class="ph" id="ph" title="Klik untuk pilih foto"><b>📷</b><span>Tambah foto</span><input name="foto" type="file" accept="image/*" hidden></label><span class="mu">Klik bulatan untuk menaruh foto mahasiswa (opsional)</span></div>`:"")+s.f.map(([k,l,t,fn])=>{
   let inp;
   if(Array.isArray(t)) inp=`<select name="${k}">${t.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
   else if(typeof t==="string"&&SEC[t]) inp=`<select name="${k}">${DB[t].map(o=>`<option>${esc(fn(o))}</option>`).join("")}</select>`;
   else inp=`<input name="${k}" type="${t||"text"}" autocomplete="off">`;
   return `<div><label>${l}</label>${inp}</div>`}).join("")+`<button class="btn">+ Tambah</button></form><div id="fmmsg" class="fmmsg">${flash}</div></div><div class="card">`;
 } else h+=`<p class="mu">${tab==="mhs"?(pre?"Anda hanya bisa mengubah data Anda sendiri. NIM hanya terlihat oleh mahasiswa terdaftar dan admin.":"🔒 Anda hanya melihat foto dan nama. Daftar (tombol kanan atas) dan tunggu persetujuan admin untuk melihat NIM dan menambahkan data diri Anda."):"Login sebagai admin untuk menambah atau menghapus data."}</p>`;
 if(tab==="mhs")h+=sg(rows)+`</div>`;else{h+=`<div class="tw"><table><thead><tr>`+(tab==="mhs"?"<th>Foto</th>":"")+s.f.map(f=>`<th>${f[1]}</th>`).join("")+(admin?"<th></th>":"")+`</tr></thead><tbody>`;
 h+=rows.length?rows.map((r,k)=>{const i=DB[tab].indexOf(r),g=tab==="mk",first=!g||k===0||rows[k-1].hari!==r.hari,n=g?rows.filter(x=>x.hari===r.hari).length:1;return `<tr${g&&first&&k>0?` class="gs"`:""}>`+(tab==="mhs"?`<td>${admin?`<button class="avb" data-p="${i}" title="Klik untuk ganti foto">${av(r)}</button>`:av(r)}</td>`:"")+s.f.map(f=>f[0]==="hari"?(first?`<td class="dayc" rowspan="${n}"><span class="bdg">${r.hari?esc(r.hari):"-"}</span></td>`:""):`<td>${esc(r[f[0]]??"")}</td>`).join("")+(admin?`<td><div class="act"><button class="del" data-i="${i}">Hapus</button></div></td>`:"")+`</tr>`}).join(""):`<tr><td colspan="9" class="mu">Belum ada data.</td></tr>`;
 h+=`</tbody></table></div></div>`;}
 $("main").innerHTML=h;flash="";if(pre)wireSelf();
 if(admin){
  const fi=$("fm").querySelector("input[type=file]");
  if(fi)fi.onchange=async()=>{if(!fi.files[0])return;try{const u=await resize(fi.files[0]),ph=$("ph");ph.style.backgroundImage=`url(${u})`;ph.classList.add("has")}catch(x){alert("Foto tidak bisa dibaca.")}};
  $("fm").onsubmit=async e=>{e.preventDefault();const o={};let f=null;new FormData(e.target).forEach((v,k)=>{if(v instanceof File){if(v.size)f=v}else o[k]=String(v).trim()});
   const need=tab==="mhs"?["nim","nama"]:["nama"],miss=need.filter(k=>!o[k]);
   if(miss.length){const m=$("fmmsg");m.className="fmmsg bad";m.textContent="⚠️ Mohon isi dulu: "+miss.map(k=>SEC[tab].f.find(x=>x[0]===k)[1]).join(", ");return}
   if(f){try{o.foto=await resize(f)}catch(x){alert("Foto tidak bisa dibaca.")}}
   DB[tab].push(o);save();flash="✅ Data berhasil ditambahkan";render()};
  document.querySelectorAll(".avb").forEach(b=>b.onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{if(!i.files[0])return;try{DB.mhs[+b.dataset.p].foto=await resize(i.files[0]);save();render()}catch(x){alert("Foto tidak bisa dibaca.")}};i.click()});
  document.querySelectorAll(".del[data-i]").forEach(b=>b.onclick=()=>{DB[tab].splice(+b.dataset.i,1);save();render()});
  document.querySelectorAll(".del[data-cu]").forEach(b=>b.onclick=async()=>{try{await REG.db.doc("mhs/"+b.dataset.cu).delete();await REG.db.doc("mhsn/"+b.dataset.cu).delete();delete MH.cloud[b.dataset.cu];delete MH.nim[b.dataset.cu];render()}catch(e){alert("Gagal menghapus: hanya pemilik web (admin) yang boleh menghapus data mahasiswa.")}});
 }
}
$("auth").onclick=()=>{
 if(admin){admin=false;try{sessionStorage.removeItem(SK)}catch(e){}render()}
 else{$("err").textContent="";$("u").value=$("p").value="";$("md").style.display="flex";hidePw();$("u").focus()}
};
$("cx").onclick=()=>$("md").style.display="none";
$("go").onclick=()=>{
 if($("u").value===USER&&$("p").value===PASS){admin=true;try{sessionStorage.setItem(SK,"1")}catch(e){}$("md").style.display="none";render()}
 else $("err").textContent="Username atau password salah.";
};
$("p").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
function hidePw(){$("p").type="password";$("eye").textContent="👁️";$("eye").setAttribute("aria-label","Tampilkan password")}
$("eye").onclick=()=>{const show=$("p").type==="password";$("p").type=show?"text":"password";$("eye").textContent=show?"🙈":"👁️";$("eye").setAttribute("aria-label",show?"Sembunyikan password":"Tampilkan password");$("p").focus()};
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
 const M=$("main");
 M.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const c=e.target.closest(".card");if(!c||c.classList.contains("nt"))return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5,m=c.classList.contains("hero")||c.classList.contains("stat")?12:2.5;c.style.transform=`perspective(900px) rotateX(${(-y*m).toFixed(2)}deg) rotateY(${(x*m).toFixed(2)}deg)`});
 M.addEventListener("pointerout",e=>{const c=e.target.closest(".card");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
}
load();DB.foto=DB.foto||[];if(!DB.fotoRev){DB.foto.reverse();DB.fotoRev=1;save()}
$("rbtn").onclick=()=>{gateOpen=true;gk="";applyGate()};
$("gate").onclick=e=>{if(e.target===$("gate")){gateOpen=false;applyGate()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&gateOpen){gateOpen=false;applyGate()}});
render();
regInit().catch(()=>{}).then(()=>{REG.ready=true;refreshUI()});
</script>
</body>
</html>
